name: Web Platform Tests

# Runs the web-platform-tests reftests of the CSS modules listed in
# src/harness/PeachBrackets.WptRunner/wpt/modules.json through PeachBrackets and fails when a module passes fewer tests than its
# committed floor (wpt/wpt-floors.json). A change that makes more tests pass raises the floor in the same pull request:
#   dotnet run --project src/harness/PeachBrackets.WptRunner -f net10.0 -- run --wpt <checkout> --floors <floors file> --update-floors
# The floors only rise; the WPT checkout is fetched at the commit pinned in wpt/WPT_COMMIT and is never committed.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/engine/PeachBrackets/**'
      - 'src/drawing/**'
      - 'src/harness/PeachBrackets.WptRunner/**'
      - '.github/workflows/wpt.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/engine/PeachBrackets/**'
      - 'src/drawing/**'
      - 'src/harness/PeachBrackets.WptRunner/**'
      - '.github/workflows/wpt.yml'

concurrency:
  group: wpt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  wpt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet

    # The font set the test workflow installs, plus Noto for the scripts the css-text tests set in system fonts (CJK, Greek, Georgian,
    # Armenian, Cyrillic extensions, ...): without them those tests fall back to whatever the runner image ships, or to nothing, and the
    # floors would say more about the image than about the engine. The floors in wpt/wpt-floors.json are measured with exactly this set.
    - name: Install fonts
      run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-liberation fonts-dejavu-core fonts-noto-core fonts-noto-cjk

    # Noto outranks DejaVu for the generic families in fontconfig's defaults, which moves the metrics of every test that says `serif`, `sans-serif`
    # or `monospace` (the CSS2 fixed-table-layout tests lost 50 passes to it). Pin the three generics to DejaVu, as they were before Noto was
    # installed, so Noto only supplies the scripts DejaVu and Liberation lack.
    - name: Pin the generic font families
      run: |
        New-Item -ItemType Directory -Force "$HOME/.config/fontconfig" | Out-Null
        @'
        <?xml version="1.0"?>
        <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
        <fontconfig>
          <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
          <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
          <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
        </fontconfig>
        '@ | Set-Content "$HOME/.config/fontconfig/fonts.conf"
        fc-cache -f
        fc-match serif; fc-match sans-serif; fc-match monospace

    - name: Cache the WPT checkout
      id: wpt-cache
      uses: actions/cache@v4
      with:
        path: ~/.peachbrackets-wpt
        key: wpt-v3-${{ hashFiles('src/harness/PeachBrackets.WptRunner/wpt/WPT_COMMIT') }}

    - name: Build the runner
      run: dotnet build src/harness/PeachBrackets.WptRunner/PeachBrackets.WptRunner.csproj --configuration Release --framework net10.0

    - name: Fetch web-platform-tests
      if: steps.wpt-cache.outputs.cache-hit != 'true'
      run: dotnet src/harness/PeachBrackets.WptRunner/bin/Release/net10.0/PeachBrackets.WptRunner.dll fetch

    - name: Run the reftests against the floors
      run: |
        $commit = (Get-Content src/harness/PeachBrackets.WptRunner/wpt/WPT_COMMIT -Raw).Trim()
        dotnet src/harness/PeachBrackets.WptRunner/bin/Release/net10.0/PeachBrackets.WptRunner.dll run `
          --wpt "$HOME/.peachbrackets-wpt/wpt/$commit" `
          --floors src/harness/PeachBrackets.WptRunner/wpt/wpt-floors.json `
          --expected-failures src/harness/PeachBrackets.WptRunner/wpt/wpt-expected-failures.json `
          --out wpt-results

    - name: Run the reftests with scripting on, against their own floors
      run: |
        $commit = (Get-Content src/harness/PeachBrackets.WptRunner/wpt/WPT_COMMIT -Raw).Trim()
        dotnet src/harness/PeachBrackets.WptRunner/bin/Release/net10.0/PeachBrackets.WptRunner.dll run `
          --wpt "$HOME/.peachbrackets-wpt/wpt/$commit" `
          --scripting `
          --floors src/harness/PeachBrackets.WptRunner/wpt/wpt-floors-scripting.json `
          --out wpt-results-scripting

    - name: Run the DOM testharness tests against their floors
      run: |
        $commit = (Get-Content src/harness/PeachBrackets.WptRunner/wpt/WPT_COMMIT -Raw).Trim()
        dotnet src/harness/PeachBrackets.WptRunner/bin/Release/net10.0/PeachBrackets.WptRunner.dll run `
          --wpt "$HOME/.peachbrackets-wpt/wpt/$commit" `
          --testharness `
          --floors src/harness/PeachBrackets.WptRunner/wpt/wpt-floors-dom.json `
          --out wpt-results-dom

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wpt-results
        path: |
          wpt-results
          wpt-results-scripting
          wpt-results-dom
        if-no-files-found: ignore
