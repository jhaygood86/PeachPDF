name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# A newer push to the same PR supersedes an in-flight run; pushes to main always run to completion.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here writes to the repository. Jobs that need more override this.
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  # Doc-only PRs shouldn't pay for the full test suite, but `test-gate` below is the required
  # status check - a trigger-level `paths:` filter would leave it stuck pending and block the
  # merge. So the workflow always runs; every heavy job is gated on whether anything under src/
  # actually changed (a skipped job counts as success for the gate).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter lists a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Detect source changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          src:
            # Everything under src/ except Version.props: a version bump changes no code, so it should not pay for the full
            # test suite, the same as a docs change. `src/**` minus one file is written as the two globs below because a
            # negated pattern in a `some` filter would instead match every file that is not that one (a docs file included).
            - 'src/*/**'
            - 'src/!(Version.props)'
            - '.github/actions/**'
            - '.github/workflows/test.yml'
            - '.github/conformance/**'
            - '.github/scripts/Test-PdfConformance.ps1'

  # One leg per {OS x suite}, run in parallel; wall time is the slowest leg rather than the sum.
  #   main   - PeachPDF.Tests and PeachBrackets.Engine.Tests, one step per project and target framework (a multi-targeted `dotnet test` would
  #            launch every TFM's test host concurrently; three ~14k-test suites plus Playwright
  #            Chromium contending for a small runner made xUnit's host miss VSTest's health-check
  #            ping and fail the job)
  #   engine - PeachDrawing.Text.Tests. Font/text engine code is OS-neutral, so Windows and macOS
  #            run net10.0 only and Ubuntu runs every TFM.
  #   small  - the CLI, Core, raster and source-generator test projects (each small, no browser)
  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        suite: [main, engine, small]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet
      with:
        # macOS skips the RC SDK (and so net11.0): net11.0 is exercised on Windows and Linux.
        include-net11: ${{ matrix.os != 'macos-latest' }}

    - name: Install fonts (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-liberation fonts-dejavu-core

    # ---- main -------------------------------------------------------------------------------

    - name: Build
      if: matrix.suite == 'main'
      run: |
        foreach ($p in 'PeachPDF.Tests', 'PeachBrackets.Engine.Tests') {
          dotnet build "src/tests/$p/$p.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Install Playwright browsers
      if: matrix.suite == 'main'
      run: |
        $playwrightScript = Get-ChildItem -Path src/tests/PeachBrackets.Engine.Tests/bin/Release -Filter playwright.ps1 -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if ($IsLinux) {
          pwsh $playwrightScript install --with-deps chromium
        } else {
          pwsh $playwrightScript install chromium
        }

    # A bare Windows Server image has no shell Content Type registered for common extensions, so
    # AssocQueryString returns a non-MIME property descriptor. Register the mappings the Windows
    # MimeTypeResolver test asserts (adding each only if absent) so the OS-native lookup returns
    # real MIME types. HKCR maps to HKLM\Software\Classes and is writable on the elevated runner.
    - name: Ensure MIME content-type associations (Windows)
      if: runner.os == 'Windows' && matrix.suite == 'main'
      run: |
        $map = @{ '.html' = 'text/html'; '.css' = 'text/css'; '.png' = 'image/png'; '.jpg' = 'image/jpeg' }
        foreach ($ext in $map.Keys) {
          $existing = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\$ext" -Name 'Content Type' -ErrorAction SilentlyContinue).'Content Type'
          if ($existing -ne $map[$ext]) {
            reg add "HKCR\$ext" /v 'Content Type' /t REG_SZ /d $map[$ext] /f | Out-Null
          }
        }

    - name: Test (net8.0)
      if: matrix.suite == 'main'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachPDF.Tests/PeachPDF.Tests.csproj --no-build --configuration Release --framework net8.0 --report-trx --report-trx-filename test-results-net8.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix test-results-net8.0 --results-directory coverage

    - name: Test HTML engine (net8.0)
      if: matrix.suite == 'main'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachBrackets.Engine.Tests/PeachBrackets.Engine.Tests.csproj --no-build --configuration Release --framework net8.0 --report-trx --report-trx-filename engine-tests-results-net8.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix engine-tests-results-net8.0 --results-directory coverage

    - name: Test (net10.0)
      if: matrix.suite == 'main'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachPDF.Tests/PeachPDF.Tests.csproj --no-build --configuration Release --framework net10.0 --report-trx --report-trx-filename test-results-net10.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix test-results-net10.0 --results-directory coverage

    - name: Test HTML engine (net10.0)
      if: matrix.suite == 'main'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachBrackets.Engine.Tests/PeachBrackets.Engine.Tests.csproj --no-build --configuration Release --framework net10.0 --report-trx --report-trx-filename engine-tests-results-net10.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix engine-tests-results-net10.0 --results-directory coverage

    - name: Test (net11.0)
      if: matrix.suite == 'main' && matrix.os != 'macos-latest'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachPDF.Tests/PeachPDF.Tests.csproj --no-build --configuration Release --framework net11.0 --report-trx --report-trx-filename test-results-net11.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix test-results-net11.0 --results-directory coverage

    - name: Test HTML engine (net11.0)
      if: matrix.suite == 'main' && matrix.os != 'macos-latest'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachBrackets.Engine.Tests/PeachBrackets.Engine.Tests.csproj --no-build --configuration Release --framework net11.0 --report-trx --report-trx-filename engine-tests-results-net11.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix engine-tests-results-net11.0 --results-directory coverage

    # ---- engine -----------------------------------------------------------------------------

    - name: Build engine tests
      if: matrix.suite == 'engine'
      run: dotnet build src/tests/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --configuration Release

    - name: Test engine (net10.0)
      if: matrix.suite == 'engine'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --no-build --configuration Release --framework net10.0 --report-trx --report-trx-filename engine-test-results-net10.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix engine-test-results-net10.0 --results-directory coverage

    - name: Test engine (net8.0)
      if: matrix.suite == 'engine' && runner.os == 'Linux'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --no-build --configuration Release --framework net8.0 --report-trx --report-trx-filename engine-test-results-net8.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix engine-test-results-net8.0 --results-directory coverage

    - name: Test engine (net11.0)
      if: matrix.suite == 'engine' && runner.os == 'Linux'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --no-build --configuration Release --framework net11.0 --report-trx --report-trx-filename engine-test-results-net11.0.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix engine-test-results-net11.0 --results-directory coverage

    # ---- small ------------------------------------------------------------------------------

    # Each project writes into the same coverage directory so the per-OS diff-coverage gate covers
    # PeachPDF.Cli, PeachDrawing.Core, PeachDrawing, PeachDrawing.PDF, PeachDrawing.Svg, PeachDrawing.Skia, PeachDrawing.Win2D (Windows leg only), the source generator and the managed Brotli codec too. Every
    # project is built once up front so the test steps can use --no-build.
    - name: Build small test projects
      if: matrix.suite == 'small'
      run: |
        foreach ($p in 'PeachPDF.Cli.Tests', 'PeachDrawing.Core.Tests', 'PeachDrawing.Tests', 'PeachDrawing.PDF.Tests', 'PeachDrawing.Svg.Tests', 'PeachDrawing.Skia.Tests', 'PeachBrackets.Tests', 'PeachPDF.SourceGenerators.Tests', 'PeachDrawing.Text.Brotli.Tests') {
          dotnet build "src/tests/$p/$p.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Test CLI
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachPDF.Cli.Tests/PeachPDF.Cli.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename cli-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix cli-test-results --results-directory coverage

    - name: Test abstraction (PeachDrawing.Core)
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Core.Tests/PeachDrawing.Core.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename abstractions-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix abstractions-test-results --results-directory coverage

    - name: Test raster backend (PeachDrawing)
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Tests/PeachDrawing.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename raster-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix raster-test-results --results-directory coverage

    - name: Test PDF writer (PeachDrawing.PDF)
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.PDF.Tests/PeachDrawing.PDF.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename pdf-writer-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix pdf-writer-test-results --results-directory coverage

    - name: Test SVG backend (PeachDrawing.Svg)
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Svg.Tests/PeachDrawing.Svg.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename svg-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix svg-test-results --results-directory coverage

    # Skia is cross-platform: its tests run on every leg, on a CPU surface they supply themselves (no GPU is needed).
    - name: Test Skia backend (PeachDrawing.Skia)
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Skia.Tests/PeachDrawing.Skia.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename skia-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix skia-test-results --results-directory coverage

    # Win2D is a Windows component: its backend is built and tested on the Windows leg only (a software device, so no GPU is needed).
    - name: Build Win2D backend tests
      if: matrix.suite == 'small' && runner.os == 'Windows'
      run: dotnet build src/tests/PeachDrawing.Win2D.Tests/PeachDrawing.Win2D.Tests.csproj --configuration Release

    - name: Test Win2D backend (PeachDrawing.Win2D)
      if: matrix.suite == 'small' && runner.os == 'Windows'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Win2D.Tests/PeachDrawing.Win2D.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename win2d-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix win2d-test-results --results-directory coverage

    - name: Test HTML engine (PeachBrackets)
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachBrackets.Tests/PeachBrackets.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename brackets-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix brackets-test-results --results-directory coverage

    # The css-properties.json -> CssPropertyRegistry.g.cs/SvgPropertyRegistry.g.cs source generator's
    # tests (JSON reader, PPGxxx diagnostics, generated-output shape).
    - name: Test source generators
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachPDF.SourceGenerators.Tests/PeachPDF.SourceGenerators.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename source-generators-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix source-generators-test-results --results-directory coverage

    # The managed Brotli decoder and encoder (PeachDrawing.Text.Brotli): the encoder's output is decoded by both the BCL and
    # the managed decoder, so a bitstream error in either shows up here.
    - name: Test managed Brotli
      if: matrix.suite == 'small'
      run: dotnet test --project ${{ github.workspace }}/src/tests/PeachDrawing.Text.Brotli.Tests/PeachDrawing.Text.Brotli.Tests.csproj --no-build --configuration Release --report-trx --report-trx-filename brotli-test-results.trx --coverlet --coverlet-output-format cobertura --coverlet-exclude-by-file "**/PeachPdfProductInfo.g.cs" --coverlet-exclude-by-file "**/PeachPDF.Cli/Program.cs" --coverlet-file-prefix brotli-test-results --results-directory coverage

    # ---- artifacts --------------------------------------------------------------------------

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.suite }}
        path: |
          coverage/**/*.trx
          src/**/TestResults/*.trx
        if-no-files-found: ignore

    # Raw per-leg cobertura files; the coverage job for this OS merges them.
    - name: Upload raw coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-raw-${{ matrix.os }}-${{ matrix.suite }}
        path: coverage/**/*.coverage.cobertura.*.xml
        if-no-files-found: ignore

  # Merges one OS's legs' coverage into the HTML report and enforces the diff-coverage gate for
  # that OS, exactly as the old single job did.
  coverage:
    needs: [changes, test]
    if: always() && needs.changes.outputs.src == 'true' && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    name: coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # global.json pins SDK 10.0.100, so the tool install needs the 10 SDK.
        dotnet-version: 10.0.x

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install diff-cover and ReportGenerator
      run: |
        pip install diff-cover
        dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Download raw coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-raw-${{ matrix.os }}-*
        path: coverage
        merge-multiple: true

    - name: Generate HTML coverage report
      run: reportgenerator -reports:coverage/**/*.coverage.cobertura.*.xml -targetdir:coverage-report -reporttypes:Html

    - name: Diff coverage gate (PRs only)
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin ${{ github.base_ref }}
        $coverageFiles = (Get-ChildItem -Path coverage -Filter "*.coverage.cobertura.*.xml" -Recurse | ForEach-Object FullName)
        diff-cover $coverageFiles --compare-branch=origin/${{ github.base_ref }} --fail-under=90 --format html:diff-cover-report.html

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-${{ matrix.os }}
        path: |
          coverage/**/*.coverage.cobertura.*.xml
          coverage-report/**
          diff-cover-report.html
        if-no-files-found: ignore

  # The TestHarness is the showcase generator for the docs site (pages.yml), and the Blazor
  # WebAssembly demo is published to peachpdf.net/demo by pages.yml; nothing else builds either in
  # CI, so compile them here to catch breaks before release day. Off the test critical path.
  build-extras:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet

    - name: Build TestHarness (showcase generator)
      run: dotnet build src/harness/PeachPDF.TestHarness/PeachPDF.TestHarness.csproj --configuration Release

    - name: Build Blazor WebAssembly demo
      run: dotnet build src/examples/PeachPDF.Demo.BlazorWasm/PeachPDF.Demo.BlazorWasm.csproj --configuration Release

  # Every PDF/A level PeachPDF offers, rendered by the Release CLI and validated by veraPDF - the unit tests prove what we
  # meant to write, this proves a conforming reader accepts it (see .github/scripts/Test-PdfConformance.ps1). veraPDF is
  # pinned to a version and a SHA-256, downloaded from Maven Central: the same bytes every run, or the job fails.
  conformance:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERAPDF_VERSION: '1.30.3'
      VERAPDF_SHA256: '3d71ad77a497ddba2cb4a8834f4e61066ba1860dc0361d0fa570b04d53f641b5'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet
      with:
        include-net11: 'false'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install fonts
      run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-liberation fonts-dejavu-core

    - name: Install veraPDF
      run: |
        $jar = Join-Path $env:RUNNER_TEMP 'verapdf-installer.jar'
        Invoke-WebRequest "https://repo1.maven.org/maven2/org/verapdf/apps/installer/$env:VERAPDF_VERSION/installer-$env:VERAPDF_VERSION-installer.jar" -OutFile $jar
        $actual = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:VERAPDF_SHA256) { throw "veraPDF installer checksum mismatch: expected $env:VERAPDF_SHA256, got $actual" }

        $target = Join-Path $env:RUNNER_TEMP 'verapdf'
        @"
        <?xml version="1.0" encoding="UTF-8" standalone="no"?>
        <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>$target</installpath></com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
            <pack index="0" name="veraPDF Runtime" selected="true"/>
            <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
            <pack index="2" name="veraPDF Validation model" selected="false"/>
            <pack index="3" name="veraPDF Documentation" selected="false"/>
            <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
        </AutomatedInstallation>
        "@ | Set-Content (Join-Path $env:RUNNER_TEMP 'verapdf-auto.xml')

        java -jar $jar (Join-Path $env:RUNNER_TEMP 'verapdf-auto.xml')
        if ($LASTEXITCODE -ne 0) { throw 'veraPDF installation failed' }
        chmod +x (Join-Path $target 'verapdf')

    # Release, not Debug: a Debug build writes a comment after every `obj` keyword, which ISO 19005 rejects.
    - name: Build CLI
      run: dotnet build src/PeachPDF.Cli/PeachPDF.Cli.csproj --configuration Release

    - name: Validate every PDF/A level with veraPDF
      run: >
        ./.github/scripts/Test-PdfConformance.ps1
        -VeraPdf (Join-Path $env:RUNNER_TEMP 'verapdf/verapdf')
        -CliDll (Join-Path $PWD 'src/PeachPDF.Cli/bin/Release/net10.0/PeachPDF.Cli.dll')
        -OutDir (Join-Path $env:RUNNER_TEMP 'conformance')

    - name: Upload PDFs and veraPDF reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pdfa-conformance
        path: ${{ runner.temp }}/conformance
        if-no-files-found: ignore

  # The single required status check. Skipped jobs (docs-only change) count as success; any failed
  # or cancelled job fails the gate.
  test-gate:
    needs: [changes, test, coverage, build-extras, conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      run: |
        $results = '${{ join(needs.*.result, ' ') }}'.Split(' ')
        Write-Host "Job results: $results"
        if ($results -contains 'failure' -or $results -contains 'cancelled') { exit 1 }
