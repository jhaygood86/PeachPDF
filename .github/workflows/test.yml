name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# A newer push to the same PR supersedes an in-flight run; pushes to main always run to completion.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  # Doc-only PRs shouldn't pay for the full test suite, but `test-gate` below is the required
  # status check - a trigger-level `paths:` filter would leave it stuck pending and block the
  # merge. So the workflow always runs; every heavy job is gated on whether anything under src/
  # actually changed (a skipped job counts as success for the gate).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Detect source changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          src:
            - 'src/**'
            - '.github/actions/**'
            - '.github/workflows/test.yml'

  # One leg per {OS x suite}, run in parallel; wall time is the slowest leg rather than the sum.
  #   main   - PeachPDF.Tests, one step per target framework (a multi-targeted `dotnet test` would
  #            launch every TFM's test host concurrently; three ~14k-test suites plus Playwright
  #            Chromium contending for a small runner made xUnit's host miss VSTest's health-check
  #            ping and fail the job)
  #   engine - PeachDrawing.Text.Tests. Font/text engine code is OS-neutral, so Windows and macOS
  #            run net10.0 only and Ubuntu runs every TFM.
  #   small  - the CLI, Core, raster and source-generator test projects (each small, no browser)
  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        suite: [main, engine, small]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet
      with:
        # macOS skips the RC SDK (and so net11.0): net11.0 is exercised on Windows and Linux.
        include-net11: ${{ matrix.os != 'macos-latest' }}

    - name: Install fonts (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-liberation fonts-dejavu-core

    # ---- main -------------------------------------------------------------------------------

    - name: Build
      if: matrix.suite == 'main'
      run: dotnet build src/PeachPDF.Tests/PeachPDF.Tests.csproj --configuration Release

    - name: Install Playwright browsers
      if: matrix.suite == 'main'
      run: |
        $playwrightScript = Get-ChildItem -Path src/PeachPDF.Tests/bin/Release -Filter playwright.ps1 -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if ($IsLinux) {
          pwsh $playwrightScript install --with-deps chromium
        } else {
          pwsh $playwrightScript install chromium
        }

    # A bare Windows Server image has no shell Content Type registered for common extensions, so
    # AssocQueryString returns a non-MIME property descriptor. Register the mappings the Windows
    # MimeTypeResolver test asserts (adding each only if absent) so the OS-native lookup returns
    # real MIME types. HKCR maps to HKLM\Software\Classes and is writable on the elevated runner.
    - name: Ensure MIME content-type associations (Windows)
      if: runner.os == 'Windows' && matrix.suite == 'main'
      run: |
        $map = @{ '.html' = 'text/html'; '.css' = 'text/css'; '.png' = 'image/png'; '.jpg' = 'image/jpeg' }
        foreach ($ext in $map.Keys) {
          $existing = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\$ext" -Name 'Content Type' -ErrorAction SilentlyContinue).'Content Type'
          if ($existing -ne $map[$ext]) {
            reg add "HKCR\$ext" /v 'Content Type' /t REG_SZ /d $map[$ext] /f | Out-Null
          }
        }

    - name: Test (net8.0)
      if: matrix.suite == 'main'
      run: dotnet test src/PeachPDF.Tests/PeachPDF.Tests.csproj --no-build --configuration Release --framework net8.0 --logger "trx;LogFileName=test-results-net8.0.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    - name: Test (net10.0)
      if: matrix.suite == 'main'
      run: dotnet test src/PeachPDF.Tests/PeachPDF.Tests.csproj --no-build --configuration Release --framework net10.0 --logger "trx;LogFileName=test-results-net10.0.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    - name: Test (net11.0)
      if: matrix.suite == 'main' && matrix.os != 'macos-latest'
      run: dotnet test src/PeachPDF.Tests/PeachPDF.Tests.csproj --no-build --configuration Release --framework net11.0 --logger "trx;LogFileName=test-results-net11.0.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    # ---- engine -----------------------------------------------------------------------------

    - name: Build engine tests
      if: matrix.suite == 'engine'
      run: dotnet build src/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --configuration Release

    - name: Test engine (net10.0)
      if: matrix.suite == 'engine'
      run: dotnet test src/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --no-build --configuration Release --framework net10.0 --logger "trx;LogFileName=engine-test-results-net10.0.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    - name: Test engine (net8.0)
      if: matrix.suite == 'engine' && runner.os == 'Linux'
      run: dotnet test src/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --no-build --configuration Release --framework net8.0 --logger "trx;LogFileName=engine-test-results-net8.0.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    - name: Test engine (net11.0)
      if: matrix.suite == 'engine' && runner.os == 'Linux'
      run: dotnet test src/PeachDrawing.Text.Tests/PeachDrawing.Text.Tests.csproj --no-build --configuration Release --framework net11.0 --logger "trx;LogFileName=engine-test-results-net11.0.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    # ---- small ------------------------------------------------------------------------------

    # Each project writes into the same coverage directory so the per-OS diff-coverage gate covers
    # PeachPDF.Cli, PeachDrawing.Core, PeachDrawing and the source generator too. Every
    # project is built once up front so the test steps can use --no-build.
    - name: Build small test projects
      if: matrix.suite == 'small'
      run: |
        foreach ($p in 'PeachPDF.Cli.Tests', 'PeachDrawing.Core.Tests', 'PeachDrawing.Tests', 'PeachPDF.SourceGenerators.Tests') {
          dotnet build "src/$p/$p.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Test CLI
      if: matrix.suite == 'small'
      run: dotnet test src/PeachPDF.Cli.Tests/PeachPDF.Cli.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=cli-test-results.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    - name: Test abstraction (PeachDrawing.Core)
      if: matrix.suite == 'small'
      run: dotnet test src/PeachDrawing.Core.Tests/PeachDrawing.Core.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=abstractions-test-results.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    - name: Test raster backend (PeachDrawing)
      if: matrix.suite == 'small'
      run: dotnet test src/PeachDrawing.Tests/PeachDrawing.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=raster-test-results.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    # The css-properties.json -> CssPropertyRegistry.g.cs/SvgPropertyRegistry.g.cs source generator's
    # tests (JSON reader, PPGxxx diagnostics, generated-output shape).
    - name: Test source generators
      if: matrix.suite == 'small'
      run: dotnet test src/PeachPDF.SourceGenerators.Tests/PeachPDF.SourceGenerators.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=source-generators-test-results.trx" --collect:"XPlat Code Coverage" --settings src/PeachPDF.Tests/coverlet.runsettings --results-directory coverage

    # ---- artifacts --------------------------------------------------------------------------

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.suite }}
        path: |
          coverage/**/*.trx
          src/**/TestResults/*.trx
        if-no-files-found: ignore

    # Raw per-leg cobertura files; the coverage job for this OS merges them.
    - name: Upload raw coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-raw-${{ matrix.os }}-${{ matrix.suite }}
        path: coverage/**/coverage.cobertura.xml
        if-no-files-found: ignore

  # Merges one OS's legs' coverage into the HTML report and enforces the diff-coverage gate for
  # that OS, exactly as the old single job did.
  coverage:
    needs: [changes, test]
    if: always() && needs.changes.outputs.src == 'true' && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    name: coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # global.json pins SDK 10.0.100, so the tool install needs the 10 SDK.
        dotnet-version: 10.0.x

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install diff-cover and ReportGenerator
      run: |
        pip install diff-cover
        dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Download raw coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-raw-${{ matrix.os }}-*
        path: coverage
        merge-multiple: true

    - name: Generate HTML coverage report
      run: reportgenerator -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html

    - name: Diff coverage gate (PRs only)
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin ${{ github.base_ref }}
        $coverageFiles = (Get-ChildItem -Path coverage -Filter coverage.cobertura.xml -Recurse | ForEach-Object FullName)
        diff-cover $coverageFiles --compare-branch=origin/${{ github.base_ref }} --fail-under=90 --html-report diff-cover-report.html

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports-${{ matrix.os }}
        path: |
          coverage/**/coverage.cobertura.xml
          coverage-report/**
          diff-cover-report.html
        if-no-files-found: ignore

  # The TestHarness is the showcase generator for the docs site (pages.yml), and the Blazor
  # WebAssembly demo is published to peachpdf.net/demo by pages.yml; nothing else builds either in
  # CI, so compile them here to catch breaks before release day. Off the test critical path.
  build-extras:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet

    - name: Build TestHarness (showcase generator)
      run: dotnet build src/PeachPDF.TestHarness/PeachPDF.TestHarness.csproj --configuration Release

    - name: Build Blazor WebAssembly demo
      run: dotnet build src/PeachPDF.Demo.BlazorWasm/PeachPDF.Demo.BlazorWasm.csproj --configuration Release

  # The single required status check. Skipped jobs (docs-only change) count as success; any failed
  # or cancelled job fails the gate.
  test-gate:
    needs: [changes, test, coverage, build-extras]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check results
      run: |
        $results = '${{ join(needs.*.result, ' ') }}'.Split(' ')
        Write-Host "Job results: $results"
        if ($results -contains 'failure' -or $results -contains 'cancelled') { exit 1 }
