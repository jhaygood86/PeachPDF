name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # A separate step because dotnet-quality applies to every entry in dotnet-version, and
    # 8.0.x/10.0.x only have GA builds; net11.0 is still pre-GA (RC), which setup-dotnet
    # classifies as "preview" quality. Drop this step (and the dotnet-quality knob) once
    # .NET 11 ships its GA SDK. global.json's rollForward "latestMajor"/allowPrerelease
    # automatically promotes to this SDK once it's installed, so the pack step below produces a
    # nupkg containing net11.0 output alongside net8.0/net10.0 with no further wiring needed (see
    # src/Directory.Build.props for how net11.0 opts in per resolved SDK).
    - name: Setup .NET 11 (RC)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
        dotnet-quality: 'preview'

    - name: Read package version
      id: version
      run: |
        VERSION=$(grep -oP '(?<=<PackageVersion>)[0-9][^<]*' src/Version.props | head -n 1)
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        if [[ "$VERSION" == *"preview"* ]]; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${{ steps.version.outputs.value }}"
        git push origin "v${{ steps.version.outputs.value }}"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PRERELEASE_FLAG=""
        if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        gh release create "v${{ steps.version.outputs.value }}" \
          --title "v${{ steps.version.outputs.value }}" \
          --generate-notes \
          $PRERELEASE_FLAG

    - name: Trigger release binaries build
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run release-binaries.yml --ref main -f tag="v${{ steps.version.outputs.value }}"

    - name: Trigger docs deploy
      if: steps.version.outputs.prerelease != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --ref main

    - name: Build
      run: |
        dotnet build src/drawing/PeachDrawing.Text.Data/PeachDrawing.Text.Data.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.Text/PeachDrawing.Text.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.Core/PeachDrawing.Core.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing/PeachDrawing.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.PDF/PeachDrawing.PDF.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.Svg/PeachDrawing.Svg.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.Skia/PeachDrawing.Skia.csproj --configuration Release
        dotnet build src/engine/PeachBrackets/PeachBrackets.csproj --configuration Release
        dotnet build src/PeachPDF/PeachPDF.csproj --configuration Release

    - name: Pack
      run: |
        dotnet pack src/drawing/PeachDrawing.Text.Data/PeachDrawing.Text.Data.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.Text/PeachDrawing.Text.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.Core/PeachDrawing.Core.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing/PeachDrawing.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.PDF/PeachDrawing.PDF.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.Svg/PeachDrawing.Svg.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.Skia/PeachDrawing.Skia.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/engine/PeachBrackets/PeachBrackets.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/PeachPDF/PeachPDF.csproj --configuration Release --no-build --output ./packages

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      # In dependency order: PeachDrawing.Text.Data first (PeachDrawing.Text depends on it), then
      # PeachDrawing.Text (PeachDrawing.Core depends on it at this same version), then
      # PeachDrawing.Core (PeachDrawing depends on it), then PeachDrawing (PeachDrawing.PDF depends on
      # it), then PeachDrawing.PDF (PeachPDF depends on it, alongside PeachDrawing and PeachDrawing.Core
      # directly), then PeachDrawing.Svg (like PeachDrawing.PDF it depends on PeachDrawing and PeachDrawing.Core; nothing depends on
      # it), then PeachDrawing.Skia (the same shape as PeachDrawing.Svg: PeachDrawing, PeachDrawing.Core and PeachImage; nothing depends on it), then PeachBrackets (PeachPDF depends on it too; it needs PeachDrawing, PeachDrawing.Core and
      # PeachDrawing.Text), then PeachPDF - each has to be on the feed
      # before anyone can restore the one that depends on it. --skip-duplicate makes this safe to re-run.
      # The exact version-pinned filenames (rather than a "PeachDrawing.Text.*"/"PeachDrawing.*" glob)
      # avoid PeachDrawing.Text.Data's own package incidentally matching the PeachDrawing.Text push, and
      # PeachDrawing.Core or PeachDrawing.PDF incidentally matching the PeachDrawing push, since each
      # pair shares a name prefix.
      run: |
        dotnet nuget push "./packages/PeachDrawing.Text.Data.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Text.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Core.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.PDF.${{ steps.version.outputs.value }}.nupkg"           --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"           --source https://api.nuget.org/v3/index.json           --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Svg.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Skia.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachBrackets.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachPDF.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

  # PeachBrackets.WinUI is a WinUI 3 control, so like PeachDrawing.Win2D it is built on Windows and pushed by its own job once the
  # packages it depends on (PeachBrackets, PeachDrawing.Win2D and what they need) are on the feed.
  publish-winui:
    needs: publish-win2d
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: Setup .NET 11 (RC)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
        dotnet-quality: 'preview'

    - name: Read package version
      id: version
      shell: pwsh
      run: |
        $version = [regex]::Match((Get-Content src/Version.props -Raw), '<PackageVersion>([0-9][^<]*)</PackageVersion>').Groups[1].Value
        "value=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version"

    - name: Build and pack
      run: |
        dotnet build src/engine/PeachBrackets.WinUI/PeachBrackets.WinUI.csproj --configuration Release
        dotnet pack src/engine/PeachBrackets.WinUI/PeachBrackets.WinUI.csproj --configuration Release --no-build --output ./packages

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      run: dotnet nuget push "./packages/PeachBrackets.WinUI.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # PeachDrawing.Win2D builds on Windows only (Win2D is a Windows App SDK component), so it is packed and pushed by its own job once
  # the packages it depends on (PeachDrawing, PeachDrawing.Core, PeachDrawing.Text) are on the feed.
  publish-win2d:
    needs: publish
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: Setup .NET 11 (RC)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
        dotnet-quality: 'preview'

    - name: Read package version
      id: version
      shell: pwsh
      run: |
        $version = [regex]::Match((Get-Content src/Version.props -Raw), '<PackageVersion>([0-9][^<]*)</PackageVersion>').Groups[1].Value
        "value=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version"

    - name: Build and pack
      run: |
        dotnet build src/drawing/PeachDrawing.Win2D/PeachDrawing.Win2D.csproj --configuration Release
        dotnet pack src/drawing/PeachDrawing.Win2D/PeachDrawing.Win2D.csproj --configuration Release --no-build --output ./packages

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      run: dotnet nuget push "./packages/PeachDrawing.Win2D.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
