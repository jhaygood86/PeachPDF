name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # This is the maintenance branch's copy of the workflow: it publishes a 0.9.x maintenance release. Run it
    # only against a maintenance branch (`gh workflow run publish.yml --ref maintenance/0.9`); main's copy
    # publishes the current series.
    if: startsWith(github.ref_name, 'maintenance/')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Read package version
      id: version
      run: |
        VERSION=$(grep -oP '(?<=<PackageVersion>)[0-9][^<]*' src/Version.props | head -n 1)
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        if [[ "$VERSION" == *"preview"* ]]; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${{ steps.version.outputs.value }}"
        git push origin "v${{ steps.version.outputs.value }}"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PRERELEASE_FLAG=""
        if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        # A maintenance release is never the repository's latest release: that stays the current series, however
        # recently this one was created.
        gh release create "v${{ steps.version.outputs.value }}" \
          --title "v${{ steps.version.outputs.value }}" \
          --target "${{ github.sha }}" \
          --generate-notes \
          --latest=false \
          $PRERELEASE_FLAG

    - name: Trigger release binaries build
      env:
        GH_TOKEN: ${{ github.token }}
      # From this branch, not main: the binaries are built with this branch's workflow and sources (net10.0).
      run: gh workflow run release-binaries.yml --ref "${{ github.ref_name }}" -f tag="v${{ steps.version.outputs.value }}"

    # No docs deploy: the site documents the current series, and a maintenance release does not change it.

    - name: Build
      run: |
        dotnet build src/drawing/PeachDrawing.Text.Data/PeachDrawing.Text.Data.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.Text/PeachDrawing.Text.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.Core/PeachDrawing.Core.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing/PeachDrawing.csproj --configuration Release
        dotnet build src/drawing/PeachDrawing.PDF/PeachDrawing.PDF.csproj --configuration Release
        dotnet build src/engine/PeachBrackets/PeachBrackets.csproj --configuration Release
        dotnet build src/PeachPDF/PeachPDF.csproj --configuration Release

    - name: Pack
      run: |
        dotnet pack src/drawing/PeachDrawing.Text.Data/PeachDrawing.Text.Data.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.Text/PeachDrawing.Text.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.Core/PeachDrawing.Core.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing/PeachDrawing.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/drawing/PeachDrawing.PDF/PeachDrawing.PDF.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/engine/PeachBrackets/PeachBrackets.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/PeachPDF/PeachPDF.csproj --configuration Release --no-build --output ./packages

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      # In dependency order: PeachDrawing.Text.Data first (PeachDrawing.Text depends on it), then
      # PeachDrawing.Text (PeachDrawing.Core depends on it at this same version), then
      # PeachDrawing.Core (PeachDrawing depends on it), then PeachDrawing (PeachDrawing.PDF depends on
      # it), then PeachDrawing.PDF (PeachPDF depends on it, alongside PeachDrawing and PeachDrawing.Core
      # directly), then PeachBrackets (PeachPDF depends on it too; it needs PeachDrawing, PeachDrawing.Core and
      # PeachDrawing.Text), then PeachPDF - each has to be on the feed
      # before anyone can restore the one that depends on it. --skip-duplicate makes this safe to re-run.
      # The exact version-pinned filenames (rather than a "PeachDrawing.Text.*"/"PeachDrawing.*" glob)
      # avoid PeachDrawing.Text.Data's own package incidentally matching the PeachDrawing.Text push, and
      # PeachDrawing.Core or PeachDrawing.PDF incidentally matching the PeachDrawing push, since each
      # pair shares a name prefix.
      run: |
        dotnet nuget push "./packages/PeachDrawing.Text.Data.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Text.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Core.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.PDF.${{ steps.version.outputs.value }}.nupkg"           --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"           --source https://api.nuget.org/v3/index.json           --skip-duplicate
        dotnet nuget push "./packages/PeachBrackets.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachPDF.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
