name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # A separate step because dotnet-quality applies to every entry in dotnet-version, and
    # 8.0.x/10.0.x only have GA builds; net11.0 is still pre-GA (RC), which setup-dotnet
    # classifies as "preview" quality. Drop this step (and the dotnet-quality knob) once
    # .NET 11 ships its GA SDK. global.json's rollForward "latestMajor"/allowPrerelease
    # automatically promotes to this SDK once it's installed, so the pack step below produces a
    # nupkg containing net11.0 output alongside net8.0/net10.0 with no further wiring needed (see
    # src/Directory.Build.props for how net11.0 opts in per resolved SDK).
    - name: Setup .NET 11 (RC)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
        dotnet-quality: 'preview'

    - name: Read package version
      id: version
      run: |
        VERSION=$(grep -oP '(?<=<PackageVersion>)[^<]+' src/Version.props)
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        if [[ "$VERSION" == *"preview"* ]]; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${{ steps.version.outputs.value }}"
        git push origin "v${{ steps.version.outputs.value }}"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PRERELEASE_FLAG=""
        if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        gh release create "v${{ steps.version.outputs.value }}" \
          --title "v${{ steps.version.outputs.value }}" \
          --generate-notes \
          $PRERELEASE_FLAG

    - name: Trigger release binaries build
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run release-binaries.yml --ref main -f tag="v${{ steps.version.outputs.value }}"

    - name: Trigger docs deploy
      if: steps.version.outputs.prerelease != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --ref main

    - name: Build
      run: |
        dotnet build src/PeachDrawing.Text.Data/PeachDrawing.Text.Data.csproj --configuration Release
        dotnet build src/PeachDrawing.Text/PeachDrawing.Text.csproj --configuration Release
        dotnet build src/PeachDrawing.Core/PeachDrawing.Core.csproj --configuration Release
        dotnet build src/PeachDrawing/PeachDrawing.csproj --configuration Release
        dotnet build src/PeachPDF/PeachPDF.csproj --configuration Release

    - name: Pack
      run: |
        dotnet pack src/PeachDrawing.Text.Data/PeachDrawing.Text.Data.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/PeachDrawing.Text/PeachDrawing.Text.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/PeachDrawing.Core/PeachDrawing.Core.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/PeachDrawing/PeachDrawing.csproj --configuration Release --no-build --output ./packages
        dotnet pack src/PeachPDF/PeachPDF.csproj --configuration Release --no-build --output ./packages

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      # In dependency order: PeachDrawing.Text.Data first (PeachDrawing.Text depends on it), then
      # PeachDrawing.Text (PeachDrawing.Core depends on it at this same version), then
      # PeachDrawing.Core (PeachDrawing depends on it), then PeachDrawing (PeachPDF depends on
      # it too, alongside PeachDrawing.Core directly), then PeachPDF - each has to be on the feed
      # before anyone can restore the one that depends on it. --skip-duplicate makes this safe to re-run.
      # The exact version-pinned filenames (rather than a "PeachDrawing.Text.*"/"PeachDrawing.*" glob)
      # avoid PeachDrawing.Text.Data's own package incidentally matching the PeachDrawing.Text push, and
      # PeachDrawing.Core incidentally matching the PeachDrawing push, since each pair shares a
      # name prefix.
      run: |
        dotnet nuget push "./packages/PeachDrawing.Text.Data.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Text.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.Core.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachDrawing.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push "./packages/PeachPDF.${{ steps.version.outputs.value }}.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
