name: CoreGraphics

# PeachDrawing.CoreGraphics builds for the macOS and iOS target frameworks, which need the macos and ios workloads and a Mac, so the main test
# workflow (ubuntu, windows and macOS legs with no workloads) does not build it. This workflow builds it for both platforms, runs its tests (the
# macOS app bundle they are, on a bitmap context: no window or GPU is needed, though Core Image uses the runner's Metal device when it has one),
# and runs the example. Not part of the required `test-gate`; it runs when the package or what it is built on changes.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/drawing/PeachDrawing.CoreGraphics/**'
      - 'src/examples/PeachDrawing.CoreGraphics.Example/**'
      - 'src/tests/PeachDrawing.CoreGraphics.Tests/**'
      - 'src/drawing/PeachDrawing.Core/**'
      - 'src/drawing/PeachDrawing/**'
      - '.github/workflows/coregraphics.yml'
  workflow_dispatch:

concurrency:
  group: coregraphics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: ./.github/actions/setup-dotnet
      with:
        include-net11: 'false'

    - name: Install the macos and ios workloads
      run: dotnet workload install macos ios

    - name: Build the package for macOS and iOS
      run: dotnet build src/drawing/PeachDrawing.CoreGraphics/PeachDrawing.CoreGraphics.csproj --configuration Release

    # The tests run as the app bundle the macOS SDK builds; the project's own script builds and starts it.
    - name: Test the CoreGraphics backend
      run: src/tests/PeachDrawing.CoreGraphics.Tests/run.sh

    - name: Run the example
      run: src/examples/PeachDrawing.CoreGraphics.Example/run.sh "$RUNNER_TEMP/coregraphics-example"

    - name: Keep the example's output
      uses: actions/upload-artifact@v4
      with:
        name: coregraphics-example
        path: ${{ runner.temp }}/coregraphics-example/*.png
