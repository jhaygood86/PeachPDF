<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quarterly report</title>
<style>body { font-family: sans-serif; font-size: 12pt } table { border-collapse: collapse } td, th { border: 1px solid #444; padding: 2pt 6pt }</style>
</head>
<body>
<header><h1>Quarterly report</h1></header>
<nav aria-label="Sections"><ul><li><a href="#summary">Summary</a></li><li><a href="#data">Data</a></li></ul></nav>
<main>
  <h2 id="summary">Summary</h2>
  <p>Sales grew <em>strongly</em> this quarter. <a href="https://example.com/report">Read the full report</a>.</p>
  <figure>
    <svg width="60" height="40" role="img" aria-label="A bar"><title>A bar</title><rect width="60" height="40" fill="orange"/></svg>
    <figcaption>One bar.</figcaption>
  </figure>
  <h2 id="data">Data</h2>
  <ol><li>One</li><li>Two</li></ol>
  <table>
    <caption>Sales</caption>
    <tr><th id="region" scope="col">Region</th><th id="total" scope="col">Total</th></tr>
    <tr><td headers="region">North</td><td headers="region total">10</td></tr>
    <tr><td>South</td><td>12</td></tr>
  </table>
  <p><label for="name">Your name</label> <input id="name" name="name" value="Ada"></p>
</main>
<footer>End of report</footer>
</body>
</html>
