name: Setup .NET SDKs
description: Installs the .NET 8/10 SDKs and restores a NuGet package cache.

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props', 'src/Directory.Packages.props', 'src/Version.props') }}
        restore-keys: nuget-${{ runner.os }}-
