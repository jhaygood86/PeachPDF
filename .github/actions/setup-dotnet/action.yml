name: Setup .NET SDKs
description: Installs the .NET 11 SDK (required by global.json) and the .NET 10 runtime (a supported target framework), and restores a NuGet package cache.

runs:
  using: composite
  steps:
    # The 11 SDK builds every project; the 10 SDK entry brings the .NET 10 runtime so the net10.0 test legs can run.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          11.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props', 'src/Directory.Packages.props', 'src/Version.props') }}
        restore-keys: nuget-${{ runner.os }}-
