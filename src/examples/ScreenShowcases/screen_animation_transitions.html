<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Transitions</title>
<style>body{margin:0;padding:24px;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#222;background:#fffaf2}h1{margin:0 0 4px;font-size:22px}p.lead{margin:0 0 20px;color:#555}.grid{display:flex;flex-wrap:wrap;gap:16px}.card{width:150px;padding:12px;border-radius:12px;background:#fff;border:1px solid #e5d9c5;box-shadow:0 2px 6px rgba(0,0,0,.08)}.card b{display:block;margin-bottom:8px;font-size:12px;color:#7a5c2e}.box{width:56px;height:56px;border-radius:10px;background:#e85d04}</style>
</head>
<body>
<h1>Transitions</h1><p class="lead">Hover or tab to a card. transform, opacity and filter move on the GPU; colours and shadows repaint just the card.</p>
<style>
.t{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s linear,filter .35s linear,background-color .35s ease,box-shadow .35s ease}
.t:hover,.t:focus{outline:none}
.lift:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 14px 24px rgba(0,0,0,.25)}
.fade{opacity:1}.fade:hover{opacity:.25}
.tilt:hover{transform:rotate(14deg) scale(1.1)}
.tint:hover{background-color:#0077b6}
.blur:hover{filter:blur(3px) saturate(2)}
.slow{transition:transform 1.5s ease-in-out}.slow:hover{transform:translateX(70px) rotate(90deg)}
.steps{transition:transform 1s steps(5,end)}.steps:hover{transform:translateX(70px)}
.delayed{transition:transform .4s ease .4s}.delayed:hover{transform:scale(1.5)}
.track{height:80px}
</style>
<div class="grid">
<div class="card"><b>lift + shadow</b><div class="track"><div class="box t lift" tabindex="0"></div></div></div>
<div class="card"><b>opacity</b><div class="track"><div class="box t fade" tabindex="0"></div></div></div>
<div class="card"><b>rotate</b><div class="track"><div class="box t tilt" tabindex="0"></div></div></div>
<div class="card"><b>background colour</b><div class="track"><div class="box t tint" tabindex="0"></div></div></div>
<div class="card"><b>filter blur</b><div class="track"><div class="box t blur" tabindex="0"></div></div></div>
<div class="card"><b>1.5s ease-in-out</b><div class="track"><div class="box slow" tabindex="0"></div></div></div>
<div class="card"><b>steps(5)</b><div class="track"><div class="box steps" tabindex="0"></div></div></div>
<div class="card"><b>0.4s delay</b><div class="track"><div class="box delayed" tabindex="0"></div></div></div>
</div>
</body></html>
