<h1>120 boxes animating at once</h1><p class="lead">Each one is its own layer, so the cost per frame is placing them, not painting them.</p>
<style>
@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:1}50%{transform:translate(18px,-14px) rotate(180deg);opacity:.5}100%{transform:translate(0,0) rotate(360deg);opacity:1}}
.wall{display:flex;flex-wrap:wrap;gap:10px}
.c{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#f48c06,#d00000);box-shadow:0 2px 5px rgba(0,0,0,.25);animation:drift 3s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
.c i{display:block;width:26px;height:26px;border-radius:50%;background:#fff8}
</style>
