<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Form controls</title>
<style>body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#222}h1,h2{margin:0}</style>
</head>
<body>
<style>body{padding:24px}label{display:block;margin:10px 0 4px}input,select,textarea,button{font:inherit}input[type=text],textarea,select{width:260px;padding:6px}</style>
<h1>Form</h1><label>Name</label><input type="text" value="Ada Lovelace"><label>Message</label><textarea rows="4">Type here...</textarea>
<label><input type="checkbox" checked> Subscribe</label><label><input type="radio" name="r" checked> Email</label><label><input type="radio" name="r"> Post</label>
<label>Volume</label><input type="range" min="0" max="10" value="6"><label>Colour</label><select><option>Red</option><option selected>Green</option><option>Blue</option></select>
<p><button type="button">Send</button> <button type="reset">Reset</button></p><progress value="0.6"></progress> <meter value="0.4"></meter>
</body></html>
