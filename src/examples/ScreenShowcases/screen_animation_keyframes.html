<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Keyframe animations</title>
<style>body{margin:0;padding:24px;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#222;background:#fffaf2}h1{margin:0 0 4px;font-size:22px}p.lead{margin:0 0 20px;color:#555}.grid{display:flex;flex-wrap:wrap;gap:16px}.card{width:150px;padding:12px;border-radius:12px;background:#fff;border:1px solid #e5d9c5;box-shadow:0 2px 6px rgba(0,0,0,.08)}.card b{display:block;margin-bottom:8px;font-size:12px;color:#7a5c2e}.box{width:56px;height:56px;border-radius:10px;background:#e85d04}</style>
</head>
<body>
<h1>Keyframe animations</h1><p class="lead">transform and opacity run on the GPU: each box is painted once and only placed again every frame.</p>
<style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(40px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.45}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes hue{0%{background:#e85d04}50%{background:#0077b6}100%{background:#e85d04}}
.spin{animation:spin 2s linear infinite}
.bounce{animation:bounce 1s ease-in-out infinite}
.pulse{animation:pulse 1.4s ease-in-out infinite}
.delay{animation:fade 1s ease 1.5s both}
.alt{animation:bounce 1.2s ease-in-out infinite alternate-reverse}
.hue{animation:hue 3s linear infinite}
.paused{animation:spin 2s linear infinite}.paused:hover{animation-play-state:paused}
.once{animation:spin 1s ease-out 3 forwards}
.track{height:70px}
</style>
<div class="grid">
<div class="card"><b>rotate, linear, infinite</b><div class="track"><div class="box spin"></div></div></div>
<div class="card"><b>translate, ease-in-out</b><div class="track"><div class="box bounce"></div></div></div>
<div class="card"><b>scale + opacity</b><div class="track"><div class="box pulse"></div></div></div>
<div class="card"><b>delay 1.5s, fill both</b><div class="track"><div class="box delay"></div></div></div>
<div class="card"><b>alternate-reverse</b><div class="track"><div class="box alt"></div></div></div>
<div class="card"><b>background colour (repaints)</b><div class="track"><div class="box hue"></div></div></div>
<div class="card"><b>hover pauses it</b><div class="track"><div class="box paused"></div></div></div>
<div class="card"><b>3 turns, then stays</b><div class="track"><div class="box once"></div></div></div>
</div>
</body></html>
