<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Viewport units</title>
<style>body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#222}h1,h2{margin:0}</style>
</head>
<body>
<style>.hero{height:100vh;background:linear-gradient(135deg,#4facfe,#00f2fe);display:flex;align-items:center;justify-content:center;color:#fff}
.hero h1{font-size:8vw}.half{height:50vh;background:#fde68a;padding:16px;box-sizing:border-box}.narrow{width:50vw;background:#bbf7d0;padding:12px}</style>
<div class="hero"><h1>100vh hero</h1></div>
<div class="half"><h2>This panel is 50vh tall</h2><p>Resize the widget (or change its height in the demo) and the hero and this panel follow the viewport.</p></div>
<div class="narrow">This box is 50vw wide.</div>
</body></html>
